# Agent développeur : se déclenche quand tu poses le label `agent:ready` sur une issue,
# ou quand tu écris `@claude …` dans une issue ou une PR (pour demander une correction).
# Seuls les comptes avec accès en écriture au dépôt peuvent le déclencher.
name: Claude — dev

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-dev-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready') ||
      (github.event_name != 'issues' && contains(toJSON(github.event), '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Toolchain du dépôt (décommente ce qui s'applique) pour que l'agent puisse lancer les tests.
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22, cache: npm }
      # - run: npm ci
      # - uses: subosito/flutter-action@v2          # dépôt fido
      #   with: { channel: stable }

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "agent:ready"
          branch_prefix: "claude/"
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --append-system-prompt "Tu travailles sans supervision pour un mainteneur solo. Lis CLAUDE.md (section 'Règles pour les agents') et docs/ECOSYSTEM.md avant d'écrire du code. Utilise le sous-agent dev-* de ce dépôt pour implémenter. Respecte strictement le périmètre de l'issue. Si une décision produit/juridique/architecture manque, ou si le diff dépasserait ~400 lignes, ne code pas : explique le blocage en commentaire et propose un découpage. Ouvre une PR (brouillon si les tests ne passent pas) qui utilise .github/pull_request_template.md et référence l'issue."
